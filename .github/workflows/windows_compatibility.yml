name: Run Server on Windows

on: [push, pull_request]

jobs:
  run-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
            Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
            .\compatibility\install.ps1

      - name: Run script with timeout
        shell: pwsh
        run: |
          try {
            $p = Start-Process -FilePath "python" -ArgumentList "app.py" -NoNewWindow -PassThru -RedirectStandardOutput "stdout.log" -RedirectStandardError "stderr.log"
            $timeout = 15
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $lastStdout = ""
            $lastStderr = ""
            while (-not $p.HasExited -and $sw.Elapsed.TotalSeconds -lt $timeout) {
              Start-Sleep -Seconds 1
              if (Test-Path "stdout.log") {
                $content = Get-Content "stdout.log" -Raw
                if ($content -ne $lastStdout) {
                  Write-Host $content
                  $lastStdout = $content
                }
              }
              if (Test-Path "stderr.log") {
                $content = Get-Content "stderr.log" -Raw
                if ($content -ne $lastStderr) {
                  Write-Host $content
                  $lastStderr = $content
                }
              }
            }
            if (-not $p.HasExited) {
              Stop-Process -Id $p.Id
              Write-Host "Process stopped after timeout"
              exit 0
            }
            if (Test-Path "stdout.log") { Get-Content "stdout.log" }
            if (Test-Path "stderr.log") { Get-Content "stderr.log" }
            exit $p.ExitCode
          } catch {
            Write-Host "Error running script"
          }
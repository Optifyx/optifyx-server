name: Run Server on Windows

on: [push, pull_request]

jobs:
  run-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script with timeout
        shell: powershell
        run: |
            $p = Start-Process python -ArgumentList 'app.py' -PassThru
            
            $timeout = 10
            $sw = [Diagnostics.Stopwatch]::StartNew()
            
            while (-not $p.HasExited -and $sw.Elapsed.TotalSeconds -lt $timeout) {
            Start-Sleep -Seconds 1
          }
            
            if (-not $p.HasExited) {
            Stop-Process -Id $p.Id
            Write-Host "Process stopped after timeout"
          }
            
            $p.WaitForExit()
            
            if ($p.ExitCode -ne 0) {
            exit $p.ExitCode
          }
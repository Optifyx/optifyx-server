name: Run Server on Windows

on: [push, pull_request]

jobs:
  run-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script with timeout
        shell: pwsh
        run: |
          try {
            $p = Start-Process -FilePath "python" -ArgumentList "app.py" -NoNewWindow -PassThru -RedirectStandardOutput "stdout.log" -RedirectStandardError "stderr.log"
            $timeout = 25
            $sw = [Diagnostics.Stopwatch]::StartNew()
            while (-not $p.HasExited -and $sw.Elapsed.TotalSeconds -lt $timeout) {
              Start-Sleep -Seconds 1
              if (Test-Path "stdout.log") { Get-Content "stdout.log" -Raw }
              if (Test-Path "stderr.log") { Get-Content "stderr.log" -Raw }
            }
            if (-not $p.HasExited) {
              Stop-Process -Id $p.Id
              Write-Host "Process stopped after timeout"
            }
            if (Test-Path "stdout.log") { Get-Content "stdout.log" }
            if (Test-Path "stderr.log") { Get-Content "stderr.log" }
            exit $p.ExitCode
          } catch {
            Write-Host "Error running script"
            exit 1
          }